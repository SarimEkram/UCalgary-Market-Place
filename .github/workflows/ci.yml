name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend (install + unit tests + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # config/redis.js does a top-level `await redisClient.connect()`,
      # which app.js pulls in transitively via the rate limiter — the
      # import smoke test needs a real Redis to connect to.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Unit tests for pure/DB-free modules (JWT signing, auth middleware).
      - name: Unit tests
        run: npm test

      # No lint config exists on the backend yet. Importing app.js exercises
      # every route/controller module it pulls in, which catches syntax
      # errors and broken imports (DB connections are lazy, so no MySQL needed).
      - name: Import smoke test
        env:
          REDIS_HOST: localhost
        run: node -e "import('./src/app.js').then(() => { console.log('app.js imported OK'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"

  docker-build:
    name: Docker build (development target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: development
          push: false
          build-args: |
            NODE_ENV=development
            PORT=8080
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: development
          push: false
          build-args: |
            PORT=3000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
